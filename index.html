<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a66">
<title>MalariaScan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4f6;--card:#fff;--ink:#12303c;--mute:#5d7a84;--line:#dfebee;--teal:#0e9ba0;--teal2:#0b8a92;--navy:#0b3d4c;--soft:#e4f3f4;--head:#eef3f6;--pos:#fde0e0;--posT:#d7373f;--neg:#d6f2e4;--negT:#1c8a5b;--inp:#f7fafb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1b20;--card:#11292f;--ink:#e4f2f4;--mute:#8fb0b8;--line:#1d3c44;--soft:#173840;--head:#173840;--pos:#4a1f23;--posT:#ff9a9a;--neg:#173d30;--negT:#7fe0b0;--inp:#0d2227}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1b20;--card:#11292f;--ink:#e4f2f4;--mute:#8fb0b8;--line:#1d3c44;--soft:#173840;--head:#173840;--pos:#4a1f23;--posT:#ff9a9a;--neg:#173d30;--negT:#7fe0b0;--inp:#0d2227}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid #5fd6da;outline-offset:2px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0a4558,#0b5a66 55%,#12808a 90%,#2aa9ad);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.lg{padding:22px 16px 14px;border-bottom:1px solid #ffffff30;margin-bottom:12px}
.lg svg{width:100%;height:auto;display:block}
aside nav a{display:flex;align-items:center;gap:14px;padding:11px 18px;color:#fff;text-decoration:none;font-weight:500;font-size:14px;cursor:pointer;margin:2px 10px;border-radius:8px}
aside nav a:hover{background:#ffffff18}aside nav a.on{background:#1b9ea3;font-weight:600}
aside nav a svg{width:20px;height:20px}
.lab{margin:auto 14px 18px;padding:12px;border:1px solid #ffffff55;border-radius:10px;background:#07344a;display:flex;align-items:center;justify-content:space-between;font-size:11.500px;line-height:1.3}
.top{display:flex;align-items:center;gap:18px;padding:12px 26px;background:var(--card);box-shadow:0 1px 6px #0b3d4c1a}
.sr{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--inp);border:1px solid var(--line);border-radius:22px;padding:0 14px;height:38px;color:var(--mute);margin-right:auto}
.sr input{flex:1;border:0;background:none;font:inherit;font-size:13px;color:var(--ink);min-width:0}
.bell{position:relative;background:none;border:0;color:var(--navy);padding:0}
:root:not([data-theme="light"]) .bell{color:var(--ink)}
.bell:after{content:"";position:absolute;top:-1px;right:0;width:8px;height:8px;border-radius:50%;background:#e5383b}
.uc{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#cfe8ea;flex:none}
.av svg{width:100%;height:100%;display:block}
.av img,.ph img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.pg{padding:20px 26px 30px;max-width:1180px}
h1{font-size:25px;font-weight:600}.sub{color:var(--mute);margin:2px 0 16px}
.card{background:var(--card);border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px #0b3d4c14}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.date{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:6px 0 16px}
.st{display:flex;align-items:center;gap:12px;padding:14px}
.ic{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#119aa0,#0b7f86);color:#fff;display:grid;place-items:center;flex:none}
.st small{font-size:11.500px;display:block;color:var(--mute)}.st b{font-size:26px;line-height:1.1;display:block;font-weight:600}.st em{font-style:normal;font-size:11px;font-weight:500;color:var(--teal)}
.two{display:grid;grid-template-columns:1.7fr 1fr;gap:14px}
.two h3,.h3{font-size:15px;font-weight:600;margin-bottom:10px}
.leg{list-style:none;padding:0;font-size:12px}.leg li{display:flex;align-items:center;gap:8px;margin:9px 0}.leg i{width:9px;height:9px;border-radius:50%}.leg b{margin-left:auto;font-weight:400;padding-left:14px}
.btn{border-radius:8px;padding:9px 20px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--teal2);background:var(--card);color:var(--teal2)}
.btn.p{background:linear-gradient(135deg,#0f9ba0,#0b7f86);color:#fff;border-color:transparent}
.btn svg{width:16px;height:16px;stroke-width:2.500}
.foot{display:flex;justify-content:space-between;margin-top:16px}
.stp{display:flex;justify-content:space-between;position:relative;padding:4px 6px 0}
.stp:before{content:"";position:absolute;left:8%;right:8%;top:19px;height:2px;background:var(--line)}
.sp{position:relative;text-align:center;font-size:11.500px;color:var(--mute);flex:1}
.sp i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;margin:0 auto 5px;background:var(--card);border:2px solid var(--line);font-style:normal;font-size:12.500px;font-weight:600;color:var(--mute)}
.sp.d i{background:var(--teal);border-color:var(--teal);color:#fff}.sp.c i{background:var(--teal2);border-color:#bfe6e8;color:#fff;box-shadow:0 0 0 3px #d4eeef}
.sp.c,.sp.d{color:var(--ink)}.sp.c{font-weight:600}.sp svg{width:15px;height:15px;stroke-width:3}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ch .ic{width:40px;height:40px}.ch b{display:block;font-size:16px}.ch span{font-size:12px;color:var(--mute)}
.body{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:center}
.f{display:block;font-size:13px;font-weight:500;margin-bottom:12px}
.f input,.f select{display:block;width:100%;margin-top:5px;border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:7px;padding:10px 12px;font:inherit;font-size:13.500px}
.hr .f{display:grid;grid-template-columns:130px 1fr;align-items:center;gap:8px}.hr .f input,.hr .f select{margin:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ph{border-radius:10px;overflow:hidden;background:#dbeef1;display:grid;place-items:center;align-self:stretch;min-height:200px}
.ph>svg{width:100%;height:100%;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.op{position:relative;text-align:center;padding:24px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}
.op.on{border-color:var(--teal);background:var(--soft);box-shadow:0 0 0 2px #0e9ba033}
.op svg.i{width:38px;height:38px;color:var(--navy);margin-bottom:6px}:root:not([data-theme="light"]) .op svg.i{color:var(--ink)}
.op b{display:block;font-size:15px}.op small{color:var(--mute)}
.op u{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:5px;background:var(--teal);color:#fff;display:none;place-items:center}.op.on u{display:grid}.op u svg,.op u svg.i,:root:not([data-theme="light"]) .op u svg.i{width:14px;height:14px;margin:0;color:#fff;stroke-width:3;display:block}
.note{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:10px 14px;margin-top:14px;font-size:12.500px;color:var(--mute)}
.note svg{color:var(--teal2);width:18px;height:18px}
.rs{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}
.im{position:relative;border-radius:8px;overflow:hidden}.im>div{transform-origin:center;transition:transform .2s}.im svg{display:block;width:100%;height:auto}
.zm{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
.zm button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}.zm svg{width:14px;height:14px}
.tabs{display:flex;gap:4px;margin-bottom:12px}.tabs button{border:0;background:none;padding:8px 14px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;font-size:13px}.tabs button.on{background:var(--soft);color:var(--ink);border-radius:6px 6px 0 0;border-bottom-color:var(--teal)}
.rv{border:1px solid var(--line);border-radius:8px;padding:14px 18px}
.rv h4{font-size:19px;font-style:italic;font-weight:600;margin-bottom:12px}.rv small{display:block;color:var(--mute);font-size:13px}.rv b{display:block;font-size:20px;font-weight:600;margin-bottom:12px}
.drop{border:2px dashed #9fd3d6;border-radius:12px;padding:44px 20px;text-align:center;background:var(--soft)}.drop svg.i{width:44px;height:44px;color:var(--teal2)}
.drop p{margin:6px 0 14px;color:var(--mute)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ok{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.okb{background:var(--soft);border-radius:10px;padding:34px 26px;height:100%}.okb h2{color:var(--teal2);font-size:23px;display:flex;align-items:center;gap:10px}.okb h2 svg{width:36px;height:36px;color:#17935a}.okb p{margin-top:12px;font-size:15px}
.tb{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tb .sr{max-width:360px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.500px;min-width:640px}th{text-align:left;padding:10px 8px;font-weight:600;border-bottom:1px solid var(--line)}td{padding:20px 8px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;border-radius:12px;padding:3px 12px;font-weight:500;font-size:12px}.p{background:var(--pos);color:var(--posT)}.n{background:var(--neg);color:var(--negT)}
.eye.ed{color:var(--teal2);border-color:var(--teal2)}.eye.ed:hover{background:var(--soft)}
.eye{width:30px;height:28px;border:1px solid var(--line);background:var(--card);border-radius:6px;color:var(--ink);display:grid;place-items:center;padding:0}.eye svg{width:16px;height:16px}
.pgn{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:16px;font-size:12px}.pgn span,.pgn button{min-width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}.pgn .on{background:var(--teal2);color:#fff;border-color:var(--teal2)}
.pf{display:flex;align-items:center;gap:16px;margin-bottom:18px}.pf .av{width:68px;height:68px}.pf b{display:block;font-size:16px}.pf small{color:var(--mute)}
.tg{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.sw{width:44px;height:24px;border-radius:12px;background:#b9c9ce;border:0;position:relative;padding:0}.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}.sw[aria-checked=true]{background:var(--teal2)}.sw[aria-checked=true]:after{left:23px}
.lgn{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;background:var(--card)}
.lgl{background:linear-gradient(150deg,#0a4558,#0b6670 60%,#12858c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:30px;position:relative;overflow:hidden}
.lgl svg.big{width:min(330px,80%);height:auto}.lgl p{font-size:15px;text-align:center;line-height:1.4;z-index:1}
.lgl:before,.lgl:after{content:"";position:absolute;border-radius:50%;background:#ffffff12}.lgl:before{width:240px;height:240px;left:-70px;bottom:-60px}.lgl:after{width:160px;height:160px;right:-30px;top:-40px}
.lgr{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px}.lgr form{width:min(380px,100%)}
.lgr h1{text-align:center;font-weight:700;font-size:28px}.lgr .sub{text-align:center;margin-bottom:26px}
.in{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--inp);border-radius:8px;padding:0 14px;height:46px;margin-bottom:14px;color:var(--mute)}.in input{flex:1;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);min-width:0}.in button{background:none;border:0;color:var(--mute);padding:0}
.big{width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:6px}
.fg{display:block;text-align:center;margin-top:18px;color:var(--teal2);font-size:13px;text-decoration:none}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}aside .lg{width:170px;border:0;margin:0;padding:10px 14px}aside nav{display:flex;flex-wrap:wrap}.lab{display:none}.two,.body,.rs,.ok,.opts,.lgn{grid-template-columns:1fr}.lgl{min-height:260px}.pg{padding:16px 14px}.hr .f{grid-template-columns:1fr}.sp{font-size:10px}.sr{display:none}}
.mockbar,.mock{background:#fff4d6;color:#7a5200;border:1px solid #f1d58a}
.mockbar{border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:18px;line-height:1.4}
.mock{border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.msg{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.msg.ok{background:var(--neg);color:var(--negT)}.msg.bad{background:var(--pos);color:var(--posT)}
.rm{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:-4px 0 12px}
.rm a{color:var(--teal2);text-decoration:none}.rm label{display:flex;gap:6px;align-items:center}
.hint{font-size:12px;color:var(--mute);margin:8px 0}
.demo{margin-top:14px;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.demo summary{cursor:pointer;color:var(--teal2);font-weight:500}
.demo div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.demo .btn{padding:4px 12px}
.demo2{border:1px dashed #f1d58a;background:#fff9e8;color:#7a5200;border-radius:8px;padding:10px 14px;font-size:12.500px;margin:12px 0}
.demo2 .btn{margin-top:8px;padding:5px 14px;background:#fff}
.spn{display:inline-block;width:14px;height:14px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;margin-right:8px}
.ur{line-height:1.2}.ur b{display:block;font-size:13px}.ur small{font-size:11px;color:var(--mute)}
.lo{padding:6px 12px;font-size:12.500px}.lo svg{width:16px;height:16px}
.tag.w{background:#fff1d6;color:#9a6200}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--mute);font-size:12.500px}.rv .kv b{display:inline;font-size:13.500px;margin:0;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--soft);border-radius:12px;padding:3px 10px;font-size:11.500px}
.f input[readonly],.f textarea[readonly]{background:color-mix(in srgb,var(--mute) 14%,var(--card));color:var(--mute)}
.auto{font-style:normal;font-size:10.5px;font-weight:600;color:var(--teal2);background:var(--soft);border-radius:8px;padding:1px 8px;margin-left:6px}
.ps{display:flex;align-items:center;gap:10px;background:var(--inp);border:1px solid var(--line);border-radius:22px;padding:0 14px;height:38px;color:var(--mute);flex:1;min-width:200px}.ps input{flex:1;border:0;background:none;font:inherit;font-size:13px;color:var(--ink);min-width:0}
.op[disabled]{opacity:.55;cursor:not-allowed}
.ei{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--inp);color:var(--ink);font:inherit;font-size:13px;text-align:right}
.bar{display:block;width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
.tw select{border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px}
.tw small{color:var(--mute)}
.two.eq{grid-template-columns:1fr 1fr}
@media(max-width:860px){.two.eq{grid-template-columns:1fr}.ur{display:none}}
.bx{position:absolute;border:2px solid #e53935;border-radius:4px;pointer-events:none}.rv label.f{margin-bottom:8px}
.f textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:7px;padding:10px 12px;font:inherit;font-size:13.5px;resize:vertical}
.vid{display:block;width:100%;max-width:520px;margin:10px auto 0;border-radius:8px;background:#000;aspect-ratio:4/3;object-fit:cover}
.bx i{position:absolute;top:0;left:0;font:600 9px/1.3 Poppins,sans-serif;background:#e53935;color:#fff;padding:0 3px;font-style:normal}

/* ===== RESPONSIVE: desktop / laptop / tablet / phone ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
img,video,canvas,svg{max-width:100%}
.app{grid-template-columns:210px minmax(0,1fr);min-height:100vh;min-height:100dvh}
aside{height:100vh;height:100dvh}
.app>*,.two>*,.body>*,.rs>*,.ok>*,.r2>*,.opts>*,.hr>*,.lgn>*,.stats>*{min-width:0}
.pg{width:100%}
.tw{max-width:100%;-webkit-overflow-scrolling:touch}
.tabs{overflow-x:auto;scrollbar-width:thin}.tabs button{white-space:nowrap}
.top{flex-wrap:wrap}
.foot{gap:10px;flex-wrap:wrap}
.lgn{min-height:100vh;min-height:100dvh}
@media(max-width:1100px){.two{grid-template-columns:1fr}.rs{grid-template-columns:1fr}}
@media(max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{position:sticky;top:0;z-index:30;height:auto;flex-wrap:nowrap;gap:4px;padding:0 8px}
 aside .lg{flex:none;width:118px;padding:8px 6px}
 aside nav{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 aside nav::-webkit-scrollbar{display:none}
 aside nav a{flex:none;white-space:nowrap;padding:9px 12px;gap:8px;margin:6px 2px;font-size:13px}
 aside nav a svg{width:18px;height:18px}
 .top{padding:10px 14px;gap:10px;justify-content:flex-end}
 .pg{padding:16px 14px 28px}
 h1{font-size:22px}
 .card{padding:16px}
 .body{align-items:stretch}
 .ph{min-height:160px}
}
@media(max-width:560px){
 .r2{grid-template-columns:1fr}
 .stp{padding:4px 0 0}.stp:before{left:6%;right:6%}
 .sp{min-width:0}.sp:not(.c){font-size:0}.sp.c{flex:2.2;font-size:11px}
 .foot .btn{flex:1;justify-content:center;padding-left:12px;padding-right:12px}
 .hd{flex-direction:column;align-items:flex-start}
 .stats{grid-template-columns:1fr 1fr;gap:10px}.st{padding:12px;gap:10px}.st b{font-size:22px}.ic{width:40px;height:40px}
 .drop{padding:28px 14px}
 .okb{padding:22px 16px}.okb h2{font-size:19px}
 .tb .sr{display:flex;max-width:none;flex:1 1 100%;width:100%;min-width:0;margin:0}
 .pgn{flex-wrap:wrap}
 .lgl{min-height:170px;gap:12px;padding:20px}.lgl svg.big{width:150px}.lgl p{font-size:13px}
 .lgr{padding:22px 16px}.lgr h1{font-size:24px}
 .uc span{display:none}
 .btn{padding:9px 14px}
 .f input,.f select,.in input,.sr input,select,textarea{font-size:16px}
}
@media(max-width:360px){.stats{grid-template-columns:1fr}.pg{padding:14px 10px 24px}}
@media(pointer:coarse){.btn,.f input,.f select,.in{min-height:44px}.eye{width:38px;height:36px}.zm button{width:36px;height:36px}.op{padding:20px 10px}}
@media(max-height:480px) and (max-width:860px){aside{position:static}}


/* ===== RESPONSIVE PATCH v2 (laptop / tablet / phone, portrait & landscape) ===== */
html,body{max-width:100%;overflow-x:hidden}
.app{grid-template-columns:210px minmax(0,1fr)}
aside{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
main{min-width:0}
.pg{margin-left:auto;margin-right:auto}
.card{min-width:0}
.kv>*{min-width:0;overflow-wrap:anywhere}
.kv b{text-align:right}
.lgl svg.big{padding:0;margin:0}
.rpt-h{flex-wrap:wrap}
.rpt-img{height:auto}
.tw table{min-width:720px}
.top>*{min-width:0}
.uc b,.ur small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;display:block}
@media(max-width:1024px) and (min-width:861px){
 .app{grid-template-columns:180px minmax(0,1fr)}
 aside nav a{padding:10px 14px;gap:10px;font-size:13.5px;margin:2px 8px}
 .lg{padding:18px 12px 12px}
 .pg{padding:18px 18px 28px}
 .top{padding:10px 18px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px) and (min-width:561px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .sp{font-size:10.5px}
}
@media(max-width:560px){
 .tw table{min-width:640px}
 .rpt-b{padding:16px 14px 4px}
 .rpt-res{font-size:14px}
 .kv{flex-wrap:wrap}
 .kv b{text-align:left}
 .tabs button{padding:8px 10px}
 h1{font-size:20px}
 .card{padding:14px}
 .top .mock{display:none}
 .lgr form,.lgr>div{width:100%}
}
@media(pointer:coarse){
 input,select,textarea,.f input,.f select,.in input,.sr input,.ps input,.ei{font-size:16px}
 .tabs button,.pgn button,aside nav a{min-height:44px}
 .bell{min-width:40px;min-height:40px}
}
@media(max-height:560px){
 .lg{padding:10px 12px 8px;margin-bottom:6px}
 .lg svg{width:110px;margin:0 auto}
 aside nav a{padding:7px 14px;margin:1px 8px}
 .lab{display:none}
 .lgl{min-height:0}
}
@media(min-width:1600px){.pg{max-width:1360px}}
@media print{aside,.top,.foot,.rpt-bar{display:none!important}.app{display:block}.rpt{box-shadow:none;border:0;max-width:100%}}
.rpt-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.rpt-bar span{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.rpt{background:#fff;color:#1e1e1e;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 18px #0b5a6624;overflow:hidden;max-width:820px;margin:0 auto 16px;font-size:13px}
.rpt-h{background:#0b5a66;color:#fff;padding:14px 26px;display:flex;justify-content:space-between;gap:12px}.rpt-h b{display:block;font-size:20px}.rpt-h span{display:block;font-size:12px;opacity:.95;margin-top:2px}
.rpt-b{padding:20px 26px 6px}.rpt-res{border-radius:6px;padding:12px 16px;font-weight:700;font-size:16px;margin-bottom:16px}.rpt-res.p{background:#fde0e0;color:#d7373f}.rpt-res.n{background:#d6f2e4;color:#1c8a5b}
.rpt-t{color:#0b5a66;font-size:13.5px;font-weight:700;border-bottom:1px solid #c8dce0;padding-bottom:3px;margin:14px 0 8px}
.rpt-r{display:grid;grid-template-columns:200px 1fr;gap:10px;padding:2px 0;line-height:1.45}.rpt-r span{font-weight:700}.rpt-r b{font-weight:400;overflow-wrap:anywhere}
.rpt-img{max-width:100%;width:420px;display:block;border-radius:4px;margin:4px 0 14px}
.rpt-f{border-top:1px solid #e3eef0;padding:10px 26px;font-size:11px;color:#6e6e6e}
@media(max-width:620px){.rpt-r{grid-template-columns:1fr;gap:0}.rpt-h,.rpt-b,.rpt-f{padding-left:16px;padding-right:16px}}

const av=u=>u&&u.photo?`<img src="${u.photo}" alt="${esc(u.name)}" width="300" height="300">`:doc();
const doc=()=>`<svg viewBox="0 0 120 140" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#doc"/></svg>`;

function smear(boxes=[],seed=11){let a=seed;const r=()=>(a=(a*9301+49297)%233280)/233280;let s='<svg viewBox="0 0 400 300" role="img" aria-label="Apusan darah mikroskopis"><rect width="400" height="300" fill="#c8b0da"/>';
for(let i=0;i<22;i++){const x=r()*400,y=r()*300,q=22+r()*14;s+=`<circle cx="${x}" cy="${y}" r="${q}" fill="url(#rb)" opacity=".85"/><circle cx="${x}" cy="${y}" r="${q*.5}" fill="#dccbe8" opacity=".5"/>`}
for(let i=0;i<10;i++)s+=`<circle cx="${r()*400}" cy="${r()*300}" r="${4+r()*3}" fill="#7a4a9e" opacity=".75"/>`;
boxes.forEach(b=>{const[x,y,w,h,c]=b;s+=`<circle cx="${x+w/2}" cy="${y+h/2}" r="${w/2.3}" fill="#e3d3ee"/><circle cx="${x+w/2}" cy="${y+h/2}" r="${w/3.4}" fill="#6a3590"/><circle cx="${x+w/2}" cy="${y+h/2}" r="${w/7}" fill="#e9dcf2"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${c}" stroke-width="2.500"/>`});
return s+'</svg>'}

function donut(){const pz=VIS().filter(e=>e.result==='Positive'),cl=['#0e9ba0','#0b3d4c','#5ec7c9','#d5e5e8'],d=(()=>{const N=['P. falciparum','P. vivax','P. malariae','P. ovale'],c=N.map(n=>pz.filter(e=>String(e.species).split(', ').includes(n)).length),t=c.reduce((a,b)=>a+b,0)||1;return N.map((n,i)=>[n,+(c[i]/t*100).toFixed(1),cl[i]])})(),tp=d.reduce((a,b)=>b[1]>a[1]?b:a),ab=['Pf','Pv','Pm','Po'][d.indexOf(tp)];let acc=0,c='';
[d[2],d[3],d[1],d[0]].forEach(v=>{c+=`<circle cx="21" cy="21" r="15.500" fill="none" stroke="${v[2]}" stroke-width="7" pathLength="100" stroke-dasharray="${v[1]} ${100-v[1]}" stroke-dashoffset="${33-acc}"/>`;acc+=v[1]});
return`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="130" height="130" style="flex:none" role="img" aria-label="${tp[1]}% ${tp[0]}">${c}<text x="21" y="22" text-anchor="middle" font-size="5.500" font-weight="600" fill="#0b3d4c" style="fill:currentColor" font-family="Poppins,sans-serif">${tp[1]}%</text><text x="21" y="27.500" text-anchor="middle" font-size="4.800" font-weight="600" style="fill:currentColor" font-family="Poppins,sans-serif">${ab}</text></svg><ul class="leg">${d.map(v=>`<li><i style="background:${v[2]}"></i>${v[0]}<b>${v[1]}%</b></li>`).join('')}</ul></div>`}

function trend(){const dd=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d}),v=dd.map(d=>VIS().filter(e=>{const t=new Date(e.date);return t>=d&&t<new Date(+d+864e5)}).length),dn=dd.map(d=>d.toLocaleDateString('en-GB',{weekday:'short'})),M=Math.max(4,...v),pk=v.indexOf(Math.max(...v)),X=i=>50+i*72,Y=n=>150-n/M*110;
const p=v.map((n,i)=>(i?'L':'M')+X(i)+' '+Y(n)).join('');
return`<svg viewBox="0 0 540 190" width="100%" role="img" aria-label="Tren pemeriksaan 7 hari terakhir"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14a5aa" stop-opacity=".3"/><stop offset="1" stop-color="#14a5aa" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3,4].map(q=>+(M*q/4).toFixed(1)).map(n=>`<line x1="36" x2="520" y1="${Y(n)}" y2="${Y(n)}" stroke="currentColor" opacity=".1"/><text x="28" y="${Y(n)+4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".7">${n}</text>`).join('')}<path d="${p}L${X(6)} 150L${X(0)} 150Z" fill="url(#tg)"/><path d="${p}" fill="none" stroke="#14a5aa" stroke-width="2.500" stroke-linejoin="round"/>${v.map((n,i)=>`<circle cx="${X(i)}" cy="${Y(n)}" r="3.500" fill="#14a5aa"><title>${dn[i]}: ${n} examinations</title></circle>`).join('')}${dn.map((d,i)=>`<text x="${X(i)}" y="168" text-anchor="middle" font-size="10.500" fill="currentColor" opacity=".8">${d}</text>`).join('')}<g transform="translate(${Math.min(432,Math.max(0,X(pk)-52))} ${Y(M)-30})"><rect width="104" height="26" rx="6" fill="var(--card)" stroke="#8fd3d6"/><text x="52" y="17" text-anchor="middle" font-size="11.500" font-weight="500" fill="currentColor">${Math.max(...v)} examinations</text></g></svg>`}


const fld=(l,k,t='text',x='')=>`<label class="f">${l}<input type="${t}" value="${esc(S[k])}" oninput="S.${k}=this.value" ${x}></label>`;
const sel=(l,k,o)=>`<label class="f">${l}<select onchange="S.${k}=this.value">${o.map(v=>`<option ${S[k]===v?'selected':''}>${v}</option>`).join('')}</select></label>`;
const steps=['Medical Record','Examiner Info','Specimen','Analysis','Verification','Result'];
const stp=n=>`<div class="card"><div class="stp">${steps.map((t,i)=>`<div class="sp ${i+1<n?'d':i+1===n?'c':''}"><i>${i+1<n?ic('check'):i+1}</i>${t}</div>`).join('')}</div></div><div style="height:14px"></div>`;
const hdr=(k,t,s)=>`<div class="ch"><span class="ic">${ic(k)}</span><div><b>${t}</b><span>${s}</span></div></div>`;
const nxt=(n,t,go)=>`<div class="foot"><button class="btn" onclick="location.hash='${n}'">${ic('l')}${n==='home'?'Cancel':'Back'}</button><button class="btn p" onclick="${go||`location.hash='${n}'`}">${t}</button></div>`;
const editBar=()=>{if(!S.editId)return'';const e=DB.exams.find(x=>x.id===S.editId);return`<div class="msg bad" role="status" style="margin-bottom:14px"><b>Editing rejected examination ${esc(S.editId)}</b>${e&&e.ver?` · rejected by ${esc(e.ver.name)} on ${fmt(e.ver.at)}`:''}<br>${e&&e.note?'Verifier note: '+esc(e.note):'The verifier did not leave a note.'}<br><small>Correct the data in any step, then press “Finish and Resubmit” in the last step. The examination goes back to the verifier’s queue.</small></div>`};
const wiz=(n,body,back,nextLbl,nextGo)=>shell(editBar()+stp(n)+`<div class="card">${body}</div>`+`<div class="foot"><button class="btn" onclick="location.hash='${back}'">${ic('l')}${n===1?'Cancel':'Back'}</button><button class="btn p" onclick="${nextGo}">${nextLbl}${nextLbl.includes('Finish')?ic('check'):ic('r')}</button></div>`,'exam-1');

const P={
home(){const hr=today.getHours(),g=hr<11?'Good Morning':hr<15?'Good Afternoon':hr<19?'Good Evening':'Good Night';
const ex=VIS(),ps=ex.filter(e=>e.result==='Positive').length,pd=ex.filter(e=>e.status==='pending').length,vf=ex.filter(e=>e.status==='verified').length,rj=ex.filter(e=>e.status==='rejected').length,st=[['doc','Total Examinations',String(ex.length),'all time'],['drop','Positive Cases',String(ps),(ex.length?Math.round(ps/ex.length*100):0)+'% of total'],['clock','Pending',String(pd),'awaiting verification'],['check','Verified',String(vf),rj+' rejected']];

/* ---------- edit & resubmit a rejected examination (laboratory examiner only) ---------- */
const canEdit=e=>{const u=Auth.user();return !!u&&!!e&&u.role==='examiner'&&e.status==='rejected'&&e.exId===u.id&&Auth.can('exam.create')};
function startEdit(id){const e=DB.exams.find(x=>x.id===id);if(!canEdit(e))return;
 if(!S.editId)S.eidBak=S.eid;
 resetPt();rstA();
 const p=e.pt||{},m=e.mr||{},c=e.cbc||{},th=e.type==='Thick';
 Object.assign(S,{editId:e.id,eid:e.id,pid:p.id||'',pm:'existing',pEdit:false,mrn:p.mrn||'',name:p.name||'',dob:p.dob||'',age:String(p.age??''),gender:p.gender||'',addr:p.addr||'',
  cmp:m.cmp||'',sOn:m.sOn||'',fOn:m.fOn||'',fpat:m.fpat||'Unknown',trv:m.trv||'Unknown',prv:m.prv||'Unknown',aml:m.aml||'Unknown',cn:m.cn||'',
  wbc:c.wbc||'',rbc:c.rbc||'',hb:c.hb||'',hct:c.hct||'',plt:c.plt||'',cdate:c.date||'',csrc:c.source||'manual',
  sample:e.sample||'Peripheral Blood',date:e.col||iso(today),smear:th?'thick':'thin',src:e.src||'upload',fn:e.fn||'',
  img:e.img||'',det:(e.det||[]).map(b=>({...b})),nP:e.nP||0,nR:e.nR||0,nW:e.nW||0,stg:e.stg?{...zs(),...e.stg}:zs(),
  sp:th?'Plasmodium sp.':(e.species&&e.species!=='—'?e.species:''),
  ai:e.ai?JSON.parse(JSON.stringify(e.ai)):null,aiRes:null,aiRaw:null,st:'done',ack:false,perr:'',pok:''});
 log('exam.edit.started','Examination '+e.id+' reopened for correction');go('exam-5')}
function endEdit(){if(!S.editId)return;S.eid=S.eidBak||S.eid;S.editId='';S.eidBak='';resetPt();rstA()}
async function resubmitExam(u){
 const old=DB.exams.find(x=>x.id===S.editId);
 if(!canEdit(old)){S.saving=false;alert('Examination ini tidak bisa diedit lagi karena statusnya bukan Rejected.');endEdit();go('history');return}
 const e=mk();
 if(S.up){/* a new image was analysed: store it like a new submission */
  let sb=await sbSaveExamination(e,u);
  if(sb.ok){const rs=await sbSaveResult(sb.id,sb.path);if(rs.ok)e.resultId=rs.id;else sb={ok:false,error:'The examination was saved, but the AI result could NOT be saved to Supabase, so the submission is not complete.\n\n'+rs.error+'\n\nPress Finish again to retry.'}}
  if(!sb.ok){S.saving=false;alert(sb.error);return}
  e.sbId=sb.id;e.sbPath=sb.path;e.patient_id=sb.patientId}
 else{e.sbId=old.sbId;e.sbPath=old.sbPath;e.resultId=old.resultId;e.patient_id=old.patient_id}
 e.exId=old.exId;e.exName=old.exName;e.exNip=old.exNip;e.exPos=old.exPos;
 e.firstDate=old.firstDate||old.date;e.rev=(old.rev||0)+1;
 e.hist=[...(old.hist||[]),{status:'rejected',note:old.note||'',by:old.ver?old.ver.name:'',at:old.ver?old.ver.at:'',rev:old.rev||0}];
 delete old.ver;delete old.note;Object.assign(old,e);
 const i=DB.exams.indexOf(old);if(i>0){DB.exams.splice(i,1);DB.exams.unshift(old)}
 log('exam.resubmitted','Examination '+old.id+' corrected and resubmitted (revision '+old.rev+')');save();
 S.saving=false;S.flash='Examination '+old.id+' was corrected and resubmitted for verification.';endEdit();go('history')}
const flash=()=>{const f=S.flash;S.flash='';return f?`<div class="msg ok" role="status">${esc(f)}</div>`:''};
P.history=()=>{const u=Auth.user(),q=S.q.toLowerCase(),fl=flash();
 const L=DB.exams.filter(e=>u.role!=='examiner'||e.exId===u.id).filter(e=>[e.pt.name,e.pt.id,e.id,e.exName].join(' ').toLowerCase().includes(q));
 return shell(`<h1>Examination History</h1><p class="sub">${u.role==='examiner'?'Your examinations.':'All examinations.'}</p>${fl}<div class="card"><div class="tb"><label class="sr">${ic('search')}<input id="hq" type="search" value="${esc(S.q)}" placeholder="Search by patient name, ID, or exam ID..." aria-label="Search history" oninput="S.q=this.value;render(true)"></label></div><div class="tw"><table><tr><th>No.</th><th>Date</th><th>Patient Name</th><th>Patient ID</th><th>Examiner</th><th>Type</th><th>Result</th><th>Status</th><th>Verified by</th><th>Action</th></tr>${L.map((e,i)=>`<tr><td>${i+1}</td><td>${fmt(e.date)}</td><td>${esc(e.pt.name)}</td><td>${esc(e.pt.id)}</td><td>${esc(e.exName)}</td><td>${esc(e.type)}</td><td><span class="tag ${e.result==='Positive'?'p':'n'}">${e.result}</span></td><td>${stg(e.status)}${e.rev?`<br><small>Revision ${e.rev}</small>`:''}</td><td>${e.ver?`${esc(e.ver.name)}<br><small>${fmt(e.ver.at)}</small>`:'—'}</td><td><div style="display:flex;gap:6px"><button class="eye" aria-label="View examination ${esc(e.id)}" data-id="${esc(e.id)}" onclick="openRv(this.dataset.id)">${ic('eye')}</button>${canEdit(e)?`<button class="eye ed" title="Edit and resubmit" aria-label="Edit and resubmit examination ${esc(e.id)}" data-id="${esc(e.id)}" onclick="startEdit(this.dataset.id)">${ic('pen')}</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="10">No examinations found.</td></tr>'}</table></div></div>`,'history')};
P.queue=()=>{const L=DB.exams.filter(e=>e.status==='pending'),fl=flash();
 return shell(`<h1>Verification Queue</h1><p class="sub">Examinations waiting for your review.</p>${fl}<div class="card"><div class="tw"><table><tr><th>Submitted</th><th>Exam ID</th><th>Patient</th><th>Examiner</th><th>Type</th><th>AI result</th><th>Action</th></tr>${L.map(e=>`<tr><td>${fmt(e.date)}</td><td>${esc(e.id)}</td><td>${esc(e.pt.name)}<br><small>${esc(e.pt.id)}</small></td><td>${esc(e.exName)}</td><td>${esc(e.type)}</td><td>${e.type==='Thick'?'':esc(e.species)+' · '}${esc(e.para)}</td><td><button class="btn p" style="padding:6px 14px" data-id="${esc(e.id)}" onclick="openRv(this.dataset.id)">Review</button></td></tr>`).join('')||'<tr><td colspan="7">No examinations are waiting for verification.</td></tr>'}</table></div></div>`,'queue')};
const rjBox=e=>{
 if(e.status==='rejected'&&e.ver)return`<div class="msg bad" role="alert" style="max-width:820px;margin:0 auto 12px"><b>Rejected by ${esc(e.ver.name)}</b> · ${fmt(e.ver.at)}<br>${e.note?esc(e.note):'The verifier did not leave a note.'}${canEdit(e)?`<div style="margin-top:10px"><button class="btn p" data-id="${esc(e.id)}" onclick="startEdit(this.dataset.id)">${ic('pen')}Edit and resubmit</button></div>`:''}</div>`;
 const h=e.status==='pending'&&e.hist&&e.hist.length?e.hist[e.hist.length-1]:null;
 return h?`<div class="note" style="max-width:820px;margin:0 auto 12px;align-items:flex-start">${ic('info')}<span><b>Revision ${e.rev}</b>: resubmitted by the examiner after rejection${h.by?' by '+esc(h.by):''}${h.at?' ('+fmt(h.at)+')':''}.${h.note?'<br>Previous note: '+esc(h.note):''}</span></div>`:''};
P.review=()=>{const u=Auth.user(),e=DB.exams.find(x=>x.id===S.rv);if(!e||(u.role==='examiner'&&e.exId!==u.id))return forbidden();
 const can=e.status==='pending'&&Auth.can('exam.verify');
 return shell(`<h1>Examination ${esc(e.id)}</h1><p class="sub">${stg(e.status)} <button class="btn" style="margin-left:10px;padding:4px 12px" onclick="pdf(DB.exams.find(x=>x.id===S.rv))">${ic('doc')}PDF</button></p>${rjBox(e)}<div class="rpt-bar"><span>${ic('info')}This is the same content as the PDF report.</span></div>${rptHtml(e)}${can?`<div style="max-width:820px;margin:0 auto"><label class="f">Verifier note (required to reject)<input id="vn" maxlength="300"></label><div id="err" class="msg bad" role="alert" hidden></div><div class="foot"><button class="btn" onclick="decide('rejected')">Reject</button><button class="btn p" onclick="decide('verified')">${ic('check')}Verify result</button></div><p class="hint">The decision is recorded under ${esc(u.name)} with the current date and time.</p></div>`:''}`,'review')};
function decide(st){const u=Auth.user();if(!Auth.can('exam.verify'))return;const e=DB.exams.find(x=>x.id===S.rv);if(!e||e.status!=='pending')return;
 const n=$('#vn').value.trim();if(st==='rejected'&&!n){const er=$('#err');er.textContent='Enter a note explaining the rejection.';er.hidden=false;return}
 e.status=st;e.note=n;e.ver={id:u.id,name:u.name,nip:u.nip||'',role:u.role,at:new Date().toISOString()};log('exam.'+st,'Examination '+e.id+(n?' – '+n.slice(0,80):''));save();S.flash='Examination '+e.id+' '+st+'.';go('history')}

/* ---------- admin: users & audit ---------- */
const ust=s=>`<span class="tag ${s==='active'?'n':s==='invited'?'w':'p'}">${s[0].toUpperCase()+s.slice(1)}</span>`;
P.users=()=>{const me=Auth.user(),fl=flash(),t=S.invt;
 return shell(`<h1>User Management</h1><p class="sub">Accounts are created or invited by an administrator only.</p>${fl}${t?`<div class="demo2"><b>Demo only</b> – in production the invitation link is emailed to the user.<br><button class="btn" onclick="openTok('${t}')">Open invitation link</button> <small>(ends your current session)</small></div>`:''}<div class="card" style="margin-bottom:14px"><h3>Invite a user</h3><div id="err" class="msg bad" role="alert" hidden></div><form onsubmit="inviteUser(event)" novalidate><div class="r2"><label class="f">Full name<input id="iname"></label><label class="f">Email<input id="iemail" type="email"></label></div><div class="r2"><label class="f">Role<select id="irole">${Object.keys(ROLE).map(r=>`<option value="${r}">${ROLE[r]}</option>`).join('')}</select></label><label class="f">Position<input id="ipos"></label></div><label class="f" style="max-width:50%">NIP / ID (optional)<input id="inip"></label><button class="btn p">Send invitation</button></form></div><div class="card"><div class="tw"><table><tr><th>Name</th><th>Username / Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>${DB.users.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.position||'')}</small></td><td>${esc(x.username||'—')}<br><small>${esc(x.email)}</small></td><td><select aria-label="Role for ${esc(x.name)}" data-id="${x.id}" onchange="setRole(this.dataset.id,this.value)" ${x.id===me.id?'disabled':''}>${Object.keys(ROLE).map(r=>`<option value="${r}" ${x.role===r?'selected':''}>${ROLE[r]}</option>`).join('')}</select></td><td>${ust(x.status)}</td><td>${x.id===me.id?'<small>You</small>':`<button class="btn" style="padding:4px 12px" data-id="${x.id}" onclick="toggleUser(this.dataset.id)">${x.status==='disabled'?'Enable':'Disable'}</button>`}</td></tr>`).join('')}</table></div></div>`,'users')};
function inviteUser(e){e.preventDefault();const er=$('#err'),bad=m=>{er.textContent=m;er.hidden=false};er.hidden=true;
 const name=$('#iname').value.trim(),em=$('#iemail').value.trim().toLowerCase();
 if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return bad('Enter a full name and a valid email address.');
 if(DB.users.some(x=>x.email===em))return bad('A user with this email already exists.');
 const base=em.split('@')[0],id='u'+Date.now().toString(36),un=DB.users.some(x=>x.username===base)?em:base,role=$('#irole').value;
 DB.users.push({id,username:un,email:em,name,role,nip:$('#inip').value.trim(),position:$('#ipos').value.trim(),status:'invited',pw:null,failed:0,lock:0});
 const t=rnd(16);DB.tokens.push({t,uid:id,type:'invite',exp:Date.now()+72*36e5,used:false});S.invt=t;
 log('user.invited',em+' as '+ROLE[role]);save();S.flash='Invitation created for '+name+'.';render()}
function setRole(id,r){const x=DB.users.find(u=>u.id===id),me=Auth.user();if(!x||!Auth.can('user.manage')||x.id===me.id||!ROLE[r])return;log('user.role_changed',x.email+': '+ROLE[x.role]+' → '+ROLE[r]);x.role=r;save();S.flash='Role updated for '+x.name+'.';render()}
function toggleUser(id){const x=DB.users.find(u=>u.id===id),me=Auth.user();if(!x||!Auth.can('user.manage')||x.id===me.id)return;
 if(x.status==='disabled'){x.status=x.pw?'active':'invited';log('user.enabled',x.email)}else{x.status='disabled';log('user.disabled',x.email)}save();render()}
P.audit=()=>{const q=S.q.toLowerCase(),L=DB.audit.filter(a=>[a.name,a.role,a.action,a.detail].join(' ').toLowerCase().includes(q)).slice(0,200);
 return shell(`<h1>Audit Log</h1><p class="sub">Security, examination and verification activity.</p><div class="card"><div class="tb"><label class="sr">${ic('search')}<input id="hq" type="search" value="${esc(S.q)}" placeholder="Search user, action, or detail..." aria-label="Search audit log" oninput="S.q=this.value;render(true)"></label></div><div class="tw"><table><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Detail</th></tr>${L.map(a=>`<tr><td>${fmt(a.ts)}</td><td>${esc(a.name)}</td><td>${esc(ROLE[a.role]||a.role)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="5">No audit entries yet.</td></tr>'}</table></div></div>`,'audit')};

/* ---------- settings (own account) ---------- */
P.prefs=()=>{const u=Auth.user(),fl=flash(),r=(a,b)=>`<label class="f">${a}<input value="${esc(b)}" readonly aria-readonly="true"></label>`;
 return shell(`<h1>Settings</h1><p class="sub">Your account. Profile changes are handled by an administrator.</p>${fl}<div class="two eq"><section class="card"><h3>Profile</h3><div class="pf"><span class="av">${av(u)}</span><div><b>${esc(u.name)}</b><small>${ROLE[u.role]}</small></div></div>${r('Username',u.username)}${r('Email',u.email)}${r(u.role==='examiner'?'NIM':'NIP / ID',u.nip||'—')}${r('Position',u.position)}<h3 style="margin-top:14px">Permissions</h3><div class="chips">${PERM[u.role].map(p=>`<span>${p}</span>`).join('')}</div></section><section class="card"><h3>Change password</h3><div id="err" class="msg bad" role="alert" hidden></div><form onsubmit="doChangePw(event)" novalidate><label class="f">Current password<input id="cp" type="password" autocomplete="current-password"></label><label class="f">New password<input id="np" type="password" autocomplete="new-password"></label><label class="f">Confirm new password<input id="np2" type="password" autocomplete="new-password"></label><p class="hint">At least 10 characters, with upper-case, lower-case and a number.</p><button class="btn p" id="cb">Save password</button></form></section></div>`,'prefs')};
async function doChangePw(e){e.preventDefault();const er=$('#err'),p=$('#np').value,bad=m=>{er.textContent=m;er.hidden=false};er.hidden=true;
 if(!$('#cp').value)return bad('Enter your current password.');if(p!==$('#np2').value)return bad('Passwords do not match.');const pe=policy(p);if(pe)return bad(pe);
 const b=$('#cb');b.disabled=true;b.innerHTML='<span class="spn"></span>Saving…';const r=await Auth.changePassword($('#cp').value,p);
 if(!r.ok){b.disabled=false;b.textContent='Save password';return bad(r.error)}S.flash='Password changed.';render()}

/* ---------- boot ---------- */
addEventListener('hashchange',()=>{scrollTo(0,0);S.q='';render()});
['click','keydown'].forEach(ev=>addEventListener(ev,()=>Auth.touch(),{passive:true}));
setInterval(()=>{if(PUBLIC.indexOf(location.hash.slice(1))<0&&!Auth.session())render()},30000);
Auth.init().then(render);
</script>
